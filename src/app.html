<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#060610" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Tema: varsayılan koyu; kullanıcı açığı seçtiyse sayfa çizilmeden önce uygulanır (yanıp sönme olmaz).
		     JS varsa reveal animasyonları gizli başlar; JS yoksa ya da uygulama 3 sn içinde açılmazsa içerik hep görünür. -->
		<script>
			try {
				// Varsayılan koyu; kullanıcı açığı seçtiyse sayfa çizilmeden önce uygulanır
				if (localStorage.getItem('theme') !== 'light') {
					document.documentElement.classList.add('dark');
				} else {
					document.querySelector('meta[name="theme-color"]').content = '#f6f6fc';
				}
			} catch (e) {}
			try {
				// Giriş animasyonu oturumda bir kez; hareket azaltma tercih edildiyse hiç
				if (
					!sessionStorage.getItem('intro') &&
					!matchMedia('(prefers-reduced-motion: reduce)').matches
				) {
					document.documentElement.classList.add('intro');
				}
			} catch (e) {}
			document.documentElement.classList.add('js');
			setTimeout(function () {
				if (!window.__hydrated) document.documentElement.classList.remove('js', 'intro');
			}, 3000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
