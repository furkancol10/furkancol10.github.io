<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#07070c" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- JS varsa reveal animasyonları gizli başlar; JS yoksa ya da uygulama 3 sn içinde açılmazsa içerik hep görünür -->
		<script>
			document.documentElement.classList.add('js');
			setTimeout(function () {
				if (!window.__hydrated) document.documentElement.classList.remove('js');
			}, 3000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
